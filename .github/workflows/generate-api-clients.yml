name: "Generate Producerflow API client libraries"
on:
  push:
    branches: [main]
    paths: [buf.yaml, buf.gen.yaml, producerflow/**]
  workflow_dispatch:
concurrency:
  group: buf-generate
  cancel-in-progress: true
permissions:
  contents: write

env:
  NODE_VERSION: 24
  GO_VERSION: 1.24.0
  PROTO_GEN_ES_VERSION: 2.6.1
  PROTO_GEN_CONNECT_ES_VERSION: 1.6.1

jobs:
  buf-generate:
    name: "Generate Producerflow API client libraries"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: 'Install protoc-gen-doc'
        run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest
      - name: 'Install @bufbuild/protoc-gen-es'
        run: npm i -g @bufbuild/protoc-gen-es@${{ env.PROTO_GEN_ES_VERSION }}
      - name: 'Install @connectrpc/protoc-gen-connect-es'
        run: npm i -g @connectrpc/protoc-gen-connect-es@${{ env.PROTO_GEN_CONNECT_ES_VERSION }}
      - name: Check buf version
        run: buf --version
      - name: Run buf generate
        run: buf generate
      - name: Commit and push changes
        run: |
          # Configure git
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are any changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing and pushing..."
            
            # Add all changes
            git add .
            
            # Commit changes
            git commit -m "chore(producerflowapi): regenerate client libraries" \
                       -m "Generated from the latest protocol buffer definitions in the producerflow/ directory." \
                       -m "Changes:" \
                       -m "- Updated Go client libraries" \
                       -m "- Updated TypeScript client libraries"
            
            # Push directly to main branch
            git push origin main
            
            echo "Successfully committed and pushed changes to main branch"
          else
            echo "No changes to commit"
          fi

