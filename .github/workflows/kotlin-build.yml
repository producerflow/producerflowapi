name: Kotlin Build Test

on:
  push:
    branches: [main]
    paths:
      - 'gen/kotlin/**'
      - 'buf.gen.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'gen/kotlin/**'
      - 'buf.gen.yaml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_VERSION: '8.11.1'

jobs:
  kotlin-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gen/kotlin

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.2.0
      with:
        gradle-version: ${{ env.GRADLE_VERSION }}

    - name: Check Kotlin generated code exists
      run: |
        java_count=$(find src/main/java -name "*.java" 2>/dev/null | wc -l)
        kotlin_count=$(find src/main/kotlin -name "*.kt" 2>/dev/null | wc -l)

        if [ "$java_count" -gt 0 ] || [ "$kotlin_count" -gt 0 ]; then
          echo "Found generated files:"
          echo "  - Java files in src/main/java: $java_count"
          echo "  - Kotlin files in src/main/kotlin: $kotlin_count"
          echo ""
          echo "Sample Java files:"
          find src/main/java -name "*.java" 2>/dev/null | head -5 || true
          echo ""
          echo "Sample Kotlin files:"
          find src/main/kotlin -name "*.kt" 2>/dev/null | head -5 || true
        else
          echo "No generated Kotlin/Java files found"
          exit 1
        fi

    - name: Build
      run: gradle build

    - name: Build success summary
      run: |
        echo "## Kotlin Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Compilation: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- Java Version: ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
