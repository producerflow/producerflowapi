  string id = 1;

  // Display name of the organization.
  // This is the human-readable name that identifies the organization to users.
  string name = 2;

  // External identifier for the organization.
  // This is the identifier used by the tenant's system to identify the organization.
  string external_id = 3;

  // Contact email address for the organization.
  string email = 4;
}

// ListOrganizationsResponse contains the list of organizations associated with the tenant.
// The organizations are returned ordered by name. If the tenant has no organizations,
// the organizations list will be empty.
message ListOrganizationsResponse {
  // List of organizations associated with the tenant.
  // Each organization includes its unique identifier and display name.
  // The list may be empty if no organizations are associated with the tenant.
  // Organizations are ordered alphabetically by name.
  repeated Organization organizations = 1;

  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Total number of organizations matching the filter criteria.
  int32 total_count = 3;
}

// GetOrganizationRequest specifies which organization to retrieve.
message GetOrganizationRequest {
  // Unique identifier of the organization to retrieve.
  // Must be a valid UUID.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetOrganizationResponse contains the details of the requested organization.
message GetOrganizationResponse {
  // The requested organization.
  Organization organization = 1;
}

// CreateProducerUploadURLRequest contains information needed to generate
// a producer upload URL. This includes the agency NPN.
message CreateProducerUploadURLRequest {
  // The National Producer Number (NPN) of the agency.
  // Required and must be a valid NPN format (numeric string between 2-10 digits).
  string agency_npn = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 10
    pattern: "^[0-9]+$"
  }];
}

// CreateProducerUploadURLResponse contains the generated URL for producer uploads
message CreateProducerUploadURLResponse {
  // URL that can be shared with the agency for producer uploads.
  // The URL is time-limited and includes necessary security tokens.
  string url = 1;
}

// Location represents a physical or virtual location where an agency operates.
// Each location includes address information and optional contact details.
message Location {
  // Unique identifier for the location.
  string id = 1;

  // Required. Name of the location. Must be unique within the agency.
  string name = 2 [(buf.validate.field).string.min_len = 1];

  // Required. Physical address of the location.
  Address address = 3 [(buf.validate.field).required = true];

  // Required. Phone number for the location.
  string phone = 4;

  // Required. Email address for the location.
  string email = 5;

  // Whether this is the primary location for the agency.
  bool is_primary = 6;
}

// AddAgencyLocationsRequest adds new locations to an agency.
message AddAgencyLocationsRequest {
  // Required. Agency ID to add locations to.
  string agency_id = 1 [(buf.validate.field).string.uuid = true];

  // Required. List of locations to add.
  repeated LocationInput locations = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 100
  ];
}

// LocationInput represents the input data for creating a new location.
message LocationInput {
  // Required. Name of the location. Must be unique within the agency.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Required. Physical address of the location.
  Address address = 2 [(buf.validate.field).required = true];

  // Required. Phone number for the location.
  string phone = 3 [(buf.validate.field).string.pattern = "^\\+?[1-9]\\d{1,14}$"];

  // Required. Email address for the location.
  string email = 4 [(buf.validate.field).string.email = true];

  // Whether this should be marked as the primary location.
  bool is_primary = 5;
}

// AddAgencyLocationsResponse contains the results of adding locations.
message AddAgencyLocationsResponse {
  // IDs of successfully created locations, in the same order as the input.
  repeated string location_ids = 1;
}

// RemoveAgencyLocationsRequest removes locations from an agency.
message RemoveAgencyLocationsRequest {
  // Required. Agency ID to remove locations from.
  string agency_id = 1 [(buf.validate.field).string.uuid = true];

  // Required. IDs of locations to remove.
  repeated string location_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
}

// RemoveAgencyLocationsResponse contains the results of removing locations.
message RemoveAgencyLocationsResponse {
  // IDs of successfully removed locations.
  repeated string removed_location_ids = 1;
}

// ListAgencyLocationsRequest retrieves all locations for an agency.
message ListAgencyLocationsRequest {
  // Required. Agency ID to list locations for.
  string agency_id = 1 [(buf.validate.field).string.uuid = true];
}

// ListAgencyLocationsResponse contains the list of agency locations.
message ListAgencyLocationsResponse {
  // List of all locations associated with the agency.
  repeated Location locations = 1;
}

// UpdateAgencyLocationRequest updates an existing agency location.
message UpdateAgencyLocationRequest {
  // Required. Agency ID that owns the location.
  string agency_id = 1 [(buf.validate.field).string.uuid = true];

  // Required. Location ID to update.
  string location_id = 2 [(buf.validate.field).string.uuid = true];

  // Optional. New name for the location. Must be unique within the agency.
  optional string name = 3 [(buf.validate.field).string.min_len = 1];

  // Optional. New address for the location.
  optional Address address = 4;

  // Optional. New phone number. Must be in E.164 format.
  optional string phone = 5 [(buf.validate.field).string.pattern = "^\\+?[1-9]\\d{1,14}$"];

  // Optional. New email address.
  optional string email = 6 [(buf.validate.field).string.email = true];

  // Optional. Whether this should be the primary location.
  optional bool is_primary = 7;
}

// UpdateAgencyLocationResponse contains the updated location details.
message UpdateAgencyLocationResponse {
  // The updated location with all current values.
  Location location = 1;
}

// AssignProducerToLocationsRequest assigns locations to a producer.
message AssignProducerToLocationsRequest {
  // Required. Producer ID to assign locations to.
  string producer_id = 1 [(buf.validate.field).string.uuid = true];

  // Required. Location IDs to assign (1-100 items).
  // These locations must belong to the same agency as the producer.
  repeated string location_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
}

// AssignProducerToLocationsResponse contains the assigned location IDs.
message AssignProducerToLocationsResponse {
  // IDs of successfully assigned locations.
  repeated string assigned_location_ids = 1;
}

// UnassignProducerFromLocationsRequest removes location assignments from a producer.
message UnassignProducerFromLocationsRequest {
  // Required. Producer ID to unassign locations from.
  string producer_id = 1 [(buf.validate.field).string.uuid = true];

  // Required. Location IDs to unassign (1-100 items).
  repeated string location_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
}

// UnassignProducerFromLocationsResponse contains the unassigned location IDs.
message UnassignProducerFromLocationsResponse {
  // IDs of successfully unassigned locations.
  repeated string unassigned_location_ids = 1;
}
