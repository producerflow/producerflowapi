syntax = "proto3";

package producerflow.appointment.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "producerflow/producer/v1/producer.proto";

// Declared explicitly, not left to buf managed mode, so that protoc-gen-go
// derives the same Go package name under Bazel as it does under buf. Managed
// mode overrides this option with an identical value.
option go_package = "github.com/producerflow/mono/gen/go/producerflow/appointment/v1;appointmentv1";

// AppointmentService manages license appointments through NIPR.
//
// Terms used throughout this service: a registry state is a state where no
// NIPR filing is needed, so an appointment is recorded immediately; a capacity
// carrier is a carrier whose has_nipr_integration is false, handled the same
// way; a synthetic appointment is one recorded in Producerflow without a
// filing because the state does not appoint that kind of entity: a producer's
// appointment derived from the agency's in the states that appoint agencies
// only (CA, DC, HI, KY, LA, MA, MT, UT, WA), or an agency's appointment in
// the states that appoint producers only (GA, IA, MN, MS, NC, NM, RI, SC, TN,
// WI), each when enabled for your tenant; an internal agency is your own
// tenant's agency. Appointments of
// internal agencies are served only once Producerflow enables internal
// appointments for your tenant: until then reads of them fail with
// FAILED_PRECONDITION and ListAppointments omits them. ListEligibleLicenses
// never lists an internal agency's licenses, whatever the setting.
//
// The appointment flow in NIPR is as follows:
// 1. A new appointment (or termination) is requested for a license number.
// 2. Some time later, NIPR processes the request and returns the final result.
//
// Since NIPR does not return results immediately, RequestAppointment and
// TerminateAppointment RPCs will return a processing status of IN_PROGRESS if
// the request is accepted by NIPR. When the appointment is finally processed by
// NIPR, Producerflow will notify via a webhook of the final result. Also, any
// call from this point on to ListAppointments or GetAppointment will also
// return the final result.
//
// IMPORTANT: Appointments in registry states or with capacity carriers
// (carriers that do not have NIPR integration) are processed automatically
// without going through NIPR. In these cases:
// - RequestAppointment will immediately return APPOINTED status.
// - TerminateAppointment will immediately return TERMINATED status.
//
// Any call to this service must be authenticated using an API key in the
// request headers. The API key can be found in the Producerflow API key
// section of the Producerflow UI and it identifies the tenant that is making
// the request.
service AppointmentService {
  // Retrieves the details of an appointment by its ID.
  rpc GetAppointment(GetAppointmentRequest) returns (GetAppointmentResponse) {}

  // Retrieves the total fees associated with requesting an appointment for the given license.
  // Fee amounts are represented as integer values in cents. E.g. $10.34 is sent as 1034.
  //
  // The quote is the state filing fee for this license, charged when the
  // request is filed with NIPR. A registry state is quoted 0; so is a
  // synthetic producer appointment when synthetic producer appointments are
  // enabled for your tenant, and a synthetic agency appointment gets an empty
  // response when synthetic agency appointments are enabled; otherwise the
  // state fee is quoted. A carrier without NIPR integration is still quoted the fee,
  // because this call takes no carrier, although nothing is charged for it.
  // Fails with FAILED_PRECONDITION when the license has no resident license
  // or no fee is configured for it.
  rpc GetAppointmentFees(GetAppointmentFeesRequest) returns (GetAppointmentFeesResponse) {}

  // Retrieves the carriers that are available to appoint licenses for the tenant.
  rpc GetAppointableCarriers(GetAppointableCarriersRequest) returns (GetAppointableCarriersResponse) {}

  // Retrieves the total fees associated with terminating an appointment for the given license.
  // Fee amounts are represented as integer values in cents. E.g. $10.34 is sent as 1034.
  rpc GetTerminationFees(GetTerminationFeesRequest) returns (GetTerminationFeesResponse) {}

  // Lists appointments for the tenant, optionally filtered by processing status.
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse) {}

  // Returns the licenses that can be appointed right now, one entry per
  // license and carrier pair; pass an entry's license_id and carrier_id to
  // RequestAppointment.
  //
  // A license is eligible when it is active and unexpired, its owner's NIPR
  // sync is active, a carrier enabled for your tenant accepts the license's
  // state, class, entity type and at least one active line of authority, no
  // appointment exists yet for that license and carrier, and the owner is not
  // already appointed or terminated with that carrier in that state on
  // another license. For an agency only
  // the agency's own licenses are returned, not its producers'. An unknown
  // owner, an owner of another tenant, or an internal agency yields an empty
  // list rather than an error.
  rpc ListEligibleLicenses(ListEligibleLicensesRequest) returns (ListEligibleLicensesResponse) {}

  // Requests a new appointment for a license that is eligible to be appointed.
  //
  // The simpler way to do this is to call ListEligibleLicenses to get a list of
  // licenses that are eligible to be appointed. Then, call RequestAppointment
  // for the licenses in the list that you want to appoint.
  //
  // Processing behavior varies based on the license state and carrier NIPR
  // integration:
  //
  // For NIPR-integrated carriers in non-registry states:
  // - The request is filed with NIPR and the appointment is returned with
  //   IN_PROGRESS processing status.
  // - NIPR processes it later. The final result, APPOINTED or REJECTED,
  //   arrives through the appointment.updated webhook event and is visible
  //   through GetAppointment and ListAppointments.
  // - A request that cannot be filed fails with one of the errors below; the
  //   call never returns REJECTED itself.
  //
  // For registry states (states that need no NIPR filing), carriers without
  // NIPR integration, and synthetic agency appointments:
  // - The appointment is recorded immediately with APPOINTED status.
  //
  // In CA, DC, HI, KY, LA, MA, MT, UT and WA only agencies are appointed and
  // producers inherit the agency's appointment. When synthetic producer
  // appointments are enabled for your tenant, a request for a producer there
  // fails with INVALID_ARGUMENT unless the producer is a sole proprietor;
  // otherwise the request is filed with NIPR.
  //
  // Requesting an appointment that already exists for the same license and
  // carrier is refused with ALREADY_EXISTS, unless that appointment is
  // TERMINATED or REJECTED. Both of those are sent to the state again, reusing
  // the existing appointment's ID and moving it back to IN_PROGRESS (or to
  // APPOINTED at once for a registry state or a carrier without NIPR
  // integration), so the result reads the same as a first request.
  //
  // Before re-sending a REJECTED appointment, fix whatever caused the
  // rejection: an unchanged appointment gets the same answer from the state
  // and is charged again.
  //
  // Either re-send is refused when the underlying license is inactive or
  // expired, since the state would reject it anyway, and when a NIPR
  // transaction is already in flight for the appointment.
  //
  // Errors:
  // - NOT_FOUND: the license or carrier does not exist for your tenant.
  // - ALREADY_EXISTS: an appointment for this license and carrier exists and
  //   is not TERMINATED or REJECTED.
  // - FAILED_PRECONDITION: the carrier is disabled, the agency is retired or
  //   in a legal entity change, the license has no resident license, the
  //   license class cannot be appointed electronically in its state, a
  //   re-send targets an inactive or expired license, a NIPR transaction is
  //   already in progress, or the filing fails validation before it is sent.
  // - INVALID_ARGUMENT: a producer appointment in a state that appoints
  //   agencies only.
  // - UNAVAILABLE: NIPR is in maintenance; retry later.
  rpc RequestAppointment(RequestAppointmentRequest) returns (RequestAppointmentResponse) {}

  // Terminates an existing appointment, permanently ending the relationship
  // between the license holder and the carrier.
  //
  // Before calling this method, you must:
  // 1. Ensure the appointment exists and is in APPOINTED status.
  // 2. Call ListTerminationReasons to get valid termination reasons for the
  //    license's state.
  // 3. Select an appropriate termination reason from the state-specific list.
  //
  // Processing behavior varies based on the license state and carrier NIPR
  // integration:
  //
  // For NIPR-integrated carriers in non-registry states:
  // - The request is submitted to NIPR for processing.
  // - Once NIPR completes processing, the status becomes TERMINATED.
  // - If NIPR rejects the termination it is not applied: the appointment stays
  //   TERMINATION_REQUESTED and no webhook event reports the rejection. Check
  //   GetAppointment and contact support to resolve it.
  // - You will receive webhook notifications when the termination is processed
  //   by NIPR.
  //
  // For registry states, capacity carriers (carriers without NIPR
  // integration), synthetic appointments, or an appointment the state has
  // already reported as terminated (risk reason STATE_APPOINTMENT_TERMINATED):
  // - The termination is recorded immediately, with no NIPR filing and no fee.
  // - Returns TERMINATED status immediately upon successful processing.
  //
  // Important considerations:
  // - Termination is permanent and cannot be undone.
  // - Termination reasons must be valid for the specific state where the
  //   license is issued.
  // - Some terminations may incur fees (check GetTerminationFees first).
  // - The response indicates whether the termination request was successfully
  //   submitted, not whether the actual termination was completed (since NIPR
  //   processes asynchronously).
  rpc TerminateAppointment(TerminateAppointmentRequest) returns (TerminateAppointmentResponse) {}

  // Lists the valid termination reasons for appointments in a specific state.
  //
  // When terminating an appointment, you must provide a valid termination
  // reason that is accepted by NIPR for the state where the license is
  // issued. Termination reasons vary by state, so you should call this method
  // first to retrieve the list of valid reasons before calling
  // TerminateAppointment.
  //
  // The termination reasons returned are based on NIPR's valid termination
  // codes for the specified state. Each reason corresponds to a specific
  // business scenario for why an appointment might be terminated (e.g.,
  // voluntary termination, inadequate production, company merger, etc.).
  rpc ListTerminationReasons(ListTerminationReasonsRequest) returns (ListTerminationReasonsResponse) {}
}

// Request to create a new appointment.
message RequestAppointmentRequest {
  // Required. The ID of the license to appoint.
  string license_id = 1 [(buf.validate.field).string.uuid = true];

  // Required. The ID of the carrier to appoint the license with.
  string carrier_id = 2 [(buf.validate.field).string.uuid = true];
}

message RequestAppointmentResponse {
  // The ID of the created appointment.
  string appointment_id = 1;

  // Processing status of the appointment request: IN_PROGRESS when the
  // request was filed with NIPR, APPOINTED when it was recorded immediately
  // (registry state, carrier without NIPR integration, synthetic appointment).
  // A NIPR rejection arrives later as REJECTED through the webhook and the
  // read operations.
  ProcessingStatus processing_status = 2;

  // Unused. The call fails with an error instead of returning reasons; a
  // later NIPR rejection is reported through the appointment.updated webhook
  // event.
  repeated string not_eligible_reasons = 3 [deprecated = true];
}

// Request to retrieve an appointment by ID.
message GetAppointmentRequest {
  // Required. The ID of the appointment to retrieve.
  string appointment_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetAppointmentResponse {
  // The appointment details.
  Appointment appointment = 1;
}

// Request to list appointments, optionally filtered by processing status.
message ListAppointmentsRequest {
  // Optional. Filter results by processing status. Without it only
  // IN_PROGRESS, APPOINTED, TERMINATED and REJECTED appointments are returned;
  // pass TERMINATION_REQUESTED or MISSING_LICENSE explicitly to see those.
  // Several values are combined with OR.
  repeated ProcessingStatus processing_status = 1;

  // Required. The producer or agency whose appointments to list.
  oneof license_owner {
    string producer_id = 2 [(buf.validate.field).string.uuid = true];
    string agency_id = 3 [(buf.validate.field).string.uuid = true];
    option (buf.validate.oneof).required = true;
  }

  // Optional. Filter results by operational status.
  repeated OperationalStatus operational_status = 4;

  // Optional. Pagination parameters.
  // If not provided, defaults to page_size=50. Maximum page_size is 200.
  producerflow.producer.v1.Pagination pagination = 5;
}

message ListAppointmentsResponse {
  // List of appointments.
  repeated Appointment appointments = 1;

  // Token for fetching the next page of results.
  // Empty when there are no more results.
  string next_page_token = 2;
}

// Request to terminate an appointment.
message TerminateAppointmentRequest {
  // ID of the appointment to terminate.
  string appointment_id = 1 [(buf.validate.field).string.uuid = true];

  // Required. Reason for termination. This must be a valid termination reason
  // for the state where the license is issued. Call ListTerminationReasons
  // first to get the list of valid reasons for the specific state; a reason
  // the state does not accept is refused by NIPR when the termination is
  // filed.
  TerminationReason reason = 2 [(buf.validate.field).enum.defined_only = true];
}

message TerminateAppointmentResponse {
  // Indicates whether the termination request was successfully processed.
  //
  // For NIPR-integrated carriers:
  // - Indicates whether the termination request was successfully submitted to
  //   NIPR.
  // - This does not indicate that the appointment has been terminated, only
  //   that the request has been accepted for processing.
  // - The actual termination will be processed asynchronously by NIPR, and
  //   you will be notified via webhook when the process completes.
  //
  // For registry states or non-NIPR carriers:
  // - Indicates whether the termination was successfully completed immediately.
  bool success = 1;
}

// Request to retrieve a list of licenses that are eligible to be appointed.
message ListEligibleLicensesRequest {
  // The applicant is the producer or agency with licenses eligible to be appointed.
  oneof applicant {
    string producer_id = 1 [(buf.validate.field).string.uuid = true];
    string agency_id = 2 [(buf.validate.field).string.uuid = true];
    option (buf.validate.oneof).required = true;
  }
}

message ListEligibleLicensesResponse {
  // List of licenses that are eligible to be appointed.
  repeated License licenses = 1;
}

// Request to get appointment fees.
message GetAppointmentFeesRequest {
  // Required. The ID of the license to get the appointment fee for.
  string license_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetAppointmentFeesResponse {
  // Total fee for the appointment in cents.
  int64 fee_in_cents = 1;
}

// Request to get termination fees.
message GetTerminationFeesRequest {
  // Required. The ID of the license to get the termination fee for.
  string license_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetTerminationFeesResponse {
  // Total fee for the termination in cents.
  int64 fee_in_cents = 1;
}

// Request to retrieve carriers that are available to be appointed.
message GetAppointableCarriersRequest {}

// Response containing carriers that are available to be appointed.
message GetAppointableCarriersResponse {
  // The list of carriers that are available to be appointed.
  repeated Carrier carriers = 1;
}

// Represents a carrier that is available to be appointed.
message Carrier {
  // The ID of the carrier.
  string carrier_id = 1;

  // The name of the carrier.
  string name = 2;

  // National Producer Number (NPN) of the carrier.
  // A unique NAIC identifier assigned to business entities during the licensing
  // application process and stored in the NIPR Producer Database (PDB).
  // Format: 1-10 digit numeric string.
  // Example: "1234567890"
  // Reference: https://nipr.com
  string npn = 3;

  // Federal Employer Identification Number (FEIN) of the carrier.
  // Format: 9-digit number assigned by the IRS for tax identification.
  // Example: "123456789"
  string fein = 4;

  // NAIC Company Code (CoCode) of the carrier.
  // A unique identifier assigned by the National Association of Insurance
  // Commissioners (NAIC) to each insurance company for regulatory reporting.
  // Format: Typically a 5-digit numeric string.
  // Example: "12345"
  // Reference: https://naic.org
  string cocode = 5;

  // Indicates whether this carrier has NIPR integration enabled. Capacity
  // carriers (carriers without NIPR integration) process appointments and
  // terminations automatically without going through NIPR.
  bool has_nipr_integration = 6;
}

// OperationalStatus represents the current operational status of an appointment.
// This indicates whether the appointment is actively functioning or at risk of termination.
//
// Values:
//   - OPERATIONAL_STATUS_UNSPECIFIED: the appointment has not been evaluated yet.
//   - OPERATIONAL_STATUS_ACTIVE: Appointment is actively functioning and meeting all requirements.
//   - OPERATIONAL_STATUS_AT_RISK: Appointment is at risk of termination due to various factors.
enum OperationalStatus {
  OPERATIONAL_STATUS_UNSPECIFIED = 0;
  // Appointment is actively functioning and meeting all requirements.
  OPERATIONAL_STATUS_ACTIVE = 1;
  // Appointment is at risk of termination due to various factors.
  OPERATIONAL_STATUS_AT_RISK = 2;
}

// RiskReason represents the specific reason why an appointment is considered at risk.
// These reasons correspond to business rules and compliance requirements that may
// trigger operational status changes.
//
// Values:
//   - RISK_REASON_LICENSE_INACTIVE: License is inactive (License Active = false).
//   - RISK_REASON_LICENSE_EXPIRED: License has expired (License ExpirationDate < current date).
//   - RISK_REASON_EO_NOT_FOUND: The agency has no E&O in effect. The E&O in effect is the shared coverage of the agency's organization while it shares coverages, the agency's own otherwise.
//   - RISK_REASON_EO_INACTIVE: The agency's E&O in effect is not approved: it is pending review or rejected. There is no "active" E&O status.
//   - RISK_REASON_EO_EXPIRED: E&O coverage has expired (E&O ExpirationDate < current date).
//   - RISK_REASON_STATE_APPOINTMENT_TERMINATED: A state has terminated the appointment (reported via NIPR) while producerflow still shows it as active.
//   - RISK_REASON_REGULATORY_ACTION: An undismissed regulatory action exists (reported via NIPR) against the appointment's producer or agency in the appointment's state.
enum RiskReason {
  RISK_REASON_UNSPECIFIED = 0;
  // License is inactive (License Active = false).
  RISK_REASON_LICENSE_INACTIVE = 1;
  // License has expired (License ExpirationDate < current date).
  RISK_REASON_LICENSE_EXPIRED = 2;
  // The agency has no E&O in effect. The E&O in effect is the shared coverage
  // of the agency's organization while it shares coverages, the agency's own
  // otherwise.
  RISK_REASON_EO_NOT_FOUND = 3;
  // The agency's E&O in effect is not approved: it is pending review or
  // rejected. There is no "active" E&O status.
  RISK_REASON_EO_INACTIVE = 4;
  // E&O coverage has expired (E&O ExpirationDate < current date).
  RISK_REASON_EO_EXPIRED = 5;
  // A state has terminated the appointment (reported via NIPR) while
  // producerflow still shows it as active.
  RISK_REASON_STATE_APPOINTMENT_TERMINATED = 6;
  // An undismissed regulatory action exists (reported via NIPR) against the
  // appointment's producer or agency in the appointment's state.
  RISK_REASON_REGULATORY_ACTION = 7;
}

// AppointmentOperationalStatus contains operational status information for an appointment.
// This message provides detailed information about the current operational state
// and any risk factors that may affect the appointment's continued validity.
message AppointmentOperationalStatus {
  // The current operational status of the appointment.
  OperationalStatus status = 1;

  // Specific reason(s) why the appointment is at risk, if applicable. This
  // field is only populated when status is AT_RISK.
  repeated RiskReason risk_reasons = 2;

  // Timestamp when the operational status was last updated. This helps track
  // when status changes occurred.
  google.protobuf.Timestamp last_updated = 3;
}

// Represents a managed appointment for a license, tracked through the
// Producerflow appointment lifecycle. Unlike NIPR-sourced appointment data
// on the Producer/Agency messages, this represents appointments that are
// actively managed (requested, terminated) through the AppointmentService.
message Appointment {
  // Unique identifier for the appointment (UUID format).
  string appointment_id = 1;

  // Information about the license being appointed.
  License license = 2;

  // The license number of the license being appointed.
  // This is a denormalized copy of license.license_number for convenience.
  string name = 3;

  // The UUID of the agency that holds this appointment.
  string agency_id = 4;

  // Optional. The UUID of the producer that holds this appointment, if any.
  // When empty, this is an agency-level appointment.
  optional string producer_id = 5;

  // The name of the carrier to which the license is appointed.
  // Examples: "State Farm", "Allstate", "Progressive"
  string carrier = 6;

  // Type of appointment (registry, up-front, just-in-time, or synthetic).
  // Determines how the appointment was established and processed.
  AppointmentType appointment_type = 7;

  // Current processing status of the appointment in the NIPR pipeline.
  // See ProcessingStatus for the complete lifecycle documentation.
  ProcessingStatus processing_status = 8;

  // Optional. Comments or notes related to the appointment.
  // May include NIPR processing notes or rejection details.
  string comments = 9;

  // Timestamp of when the appointment became or becomes effective.
  google.protobuf.Timestamp effective_date = 10;

  // Optional. Timestamp of when the appointment was terminated.
  // Only populated when processing_status is TERMINATED.
  optional google.protobuf.Timestamp termination_date = 11;

  // Timestamp of the last update to this appointment record.
  google.protobuf.Timestamp updated_at = 12;

  // Operational status information for the appointment. Provides insight into
  // the current operational health and any risk factors (e.g., expired license,
  // inactive E&O) that may affect the appointment's continued validity.
  AppointmentOperationalStatus operational_status = 13;

  // NAIC Company Code (CoCode) of the carrier.
  // A unique identifier assigned by the National Association of Insurance
  // Commissioners (NAIC) for regulatory reporting.
  // Format: Typically a 5-digit numeric string.
  // Reference: https://naic.org
  string cocode = 14;

  // Optional. The UUID of the parent appointment, if this is a synthetic
  // appointment (APPOINTMENT_TYPE_SYNTHETIC). Empty for non-synthetic
  // appointments. Synthetic appointments inherit properties from and are
  // terminated with their parent appointment.
  string parent_appointment_id = 15;
}

// ProcessingStatus represents the lifecycle state of an appointment as it
// moves through the NIPR processing pipeline.
//
// Appointment Lifecycle:
//
//   RequestAppointment
//         |
//         v
//   IN_PROGRESS -----> APPOINTED (active appointment)
//         |                  |
//         v                  v (TerminateAppointment)
//     REJECTED         TERMINATION_REQUESTED --> TERMINATED
//
// For registry states or capacity carriers (no NIPR integration):
//   RequestAppointment --> APPOINTED (immediate)
//   TerminateAppointment --> TERMINATED (immediate)
//
// Reference: https://pdb.nipr.com/Gateway
//
// Values:
//   - PROCESSING_STATUS_UNSPECIFIED: never returned for an appointment.
//   - PROCESSING_STATUS_IN_PROGRESS: Appointment request has been submitted to NIPR and is awaiting processing. This is a transient state; the final result will be delivered via webhook.
//   - PROCESSING_STATUS_APPOINTED: Appointment has been approved and is active. The producer/agency can sell this carrier's products for the specified Line of Authority.
//   - PROCESSING_STATUS_TERMINATED: Appointment has been terminated. The producer/agency can no longer sell this carrier's products. This is a terminal state.
//   - PROCESSING_STATUS_REJECTED: Appointment request was rejected by NIPR. The API does not carry the reason. Common reasons include: missing resident license, unmet continuing education requirements, or outstanding regulatory actions.
//   - PROCESSING_STATUS_MISSING_LICENSE: The license required for this appointment is missing or could not be found. The producer/agency needs to obtain the appropriate license before the appointment can be processed.
//   - PROCESSING_STATUS_TERMINATION_REQUESTED: A termination request has been submitted to NIPR and is awaiting processing. This is a transient state; the final result (TERMINATED) will be delivered via webhook.
enum ProcessingStatus {
  PROCESSING_STATUS_UNSPECIFIED = 0;

  // Appointment request has been submitted to NIPR and is awaiting processing.
  // This is a transient state; the final result will be delivered via webhook.
  PROCESSING_STATUS_IN_PROGRESS = 1;

  // Appointment has been approved and is active. The producer/agency can sell
  // this carrier's products for the specified Line of Authority.
  PROCESSING_STATUS_APPOINTED = 2;

  // Appointment has been terminated. The producer/agency can no longer sell
  // this carrier's products. This is a terminal state.
  PROCESSING_STATUS_TERMINATED = 3;

  // Appointment request was rejected by NIPR. The API does not carry the
  // reason. Common reasons include: missing resident license, unmet
  // continuing education requirements, or outstanding regulatory actions.
  PROCESSING_STATUS_REJECTED = 4;

  // The license required for this appointment is missing or could not be found.
  // The producer/agency needs to obtain the appropriate license before the
  // appointment can be processed.
  PROCESSING_STATUS_MISSING_LICENSE = 5;

  // A termination request has been submitted to NIPR and is awaiting
  // processing. This is a transient state; the final result (TERMINATED)
  // will be delivered via webhook.
  PROCESSING_STATUS_TERMINATION_REQUESTED = 6;
}

// AppointmentType categorizes how the appointment was established and
// processed.
//
// The appointment type determines the processing behavior:
// - Registry and Synthetic appointments are processed automatically
// - Up-front appointments go through NIPR's standard processing pipeline
// - Just-in-time appointments are created on demand when needed
//
// Values:
//   - APPOINTMENT_TYPE_UNSPECIFIED: the type could not be derived.
//   - APPOINTMENT_TYPE_REGISTRY: Registry appointment: Processed automatically for licenses in registry states. Registry states allow appointments without going through NIPR's standard appointment process.
//   - APPOINTMENT_TYPE_UP_FRONT: Up-front appointment: Standard appointment processed through NIPR. These require NIPR approval and may take time to process. The carrier pays appointment fees to NIPR/state.
//   - APPOINTMENT_TYPE_JUST_IN_TIME: Just-in-time appointment: Created on demand when a producer needs to sell a product but doesn't have a pre-existing appointment.
//   - APPOINTMENT_TYPE_SYNTHETIC: Synthetic appointment: Programmatically created for individual producers in states where only agency-level appointments are permitted (CA, DC, HI, KY, LA, MA, MT, UT, WA). They are automatically created when an agency appointment is approved and inherit properties from the parent agency appointment. The parent_appointment_id field links to the parent agency appointment. Synthetic appointments do not require separate regulatory approval and are terminated when the parent appointment is terminated.
enum AppointmentType {
  APPOINTMENT_TYPE_UNSPECIFIED = 0;

  // Registry appointment: Processed automatically for licenses in registry
  // states. Registry states allow appointments without going through NIPR's
  // standard appointment process.
  APPOINTMENT_TYPE_REGISTRY = 1;

  // Up-front appointment: Standard appointment processed through NIPR.
  // These require NIPR approval and may take time to process. The carrier
  // pays appointment fees to NIPR/state.
  APPOINTMENT_TYPE_UP_FRONT = 2;

  // Just-in-time appointment: Created on demand when a producer needs to
  // sell a product but doesn't have a pre-existing appointment.
  APPOINTMENT_TYPE_JUST_IN_TIME = 3;

  // Synthetic appointment: Programmatically created for individual producers
  // in states where only agency-level appointments are permitted
  // (CA, DC, HI, KY, LA, MA, MT, UT, WA). They are automatically created when
  // an agency appointment is approved and inherit properties from the parent
  // agency appointment. The parent_appointment_id field links to the parent
  // agency appointment. Synthetic appointments do not require separate
  // regulatory approval and are terminated when the parent appointment is
  // terminated.
  APPOINTMENT_TYPE_SYNTHETIC = 4;
}

message License {
  // The ID of the license.
  string license_id = 1 [(buf.validate.field).string.uuid = true];

  // The license number assigned by the state Department of Insurance (DOI).
  // Format varies by state (e.g., numeric, alphanumeric, or with prefixes).
  // Examples: "0A12345" (CA), "BR-1234567" (TX), "100012345" (FL)
  // This is a state-specific identifier, not globally unique across states.
  string license_number = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];

  // The owner of the license, it can be an agency or a producer.
  oneof license_owner {
    string producer_id = 3 [(buf.validate.field).string.uuid = true];
    string agency_id = 4 [(buf.validate.field).string.uuid = true];
  }

  // The two-letter US state or territory code that issued the license.
  // Format: ISO 3166-2 subdivision code (e.g., "CA", "TX", "NY").
  string state = 5 [(buf.validate.field).string.len = 2];

  // License class description as defined by the state DOI.
  // Describes the broad category of insurance the license covers.
  // Common classes include:
  // - "Insurance Producer": General license to sell insurance
  // - "Limited Lines Producer": Restricted to specific product types
  // - "Surplus Lines Broker": Authorized for non-admitted carriers
  // Values vary by state as each DOI defines its own license classes.
  string license_class = 6;

  // Not populated today; always false. To predict whether a request completes
  // immediately, use Carrier.has_nipr_integration from GetAppointableCarriers.
  bool is_registry_state = 7 [deprecated = true];

  // The ID of the carrier associated with this license.
  string carrier_id = 8 [(buf.validate.field).string.uuid = true];

  // The date the license expires.
  google.type.Date expiration_date = 9;

  // The date the license was issued.
  google.type.Date issue_date = 10;
}

message ListTerminationReasonsRequest {
  // Required. The two-letter state code of the license for which you want to
  // retrieve valid termination reasons. Different states may have different
  // sets of valid termination reasons accepted by NIPR.
  string state = 1 [(buf.validate.field).string.len = 2];
}

message ListTerminationReasonsResponse {
  // The list of valid termination reasons for the specified state. These
  // reasons can be used when calling TerminateAppointment for licenses issued
  // in this state.
  repeated TerminationReason termination_reasons = 1;
}

// TerminationReason represents the reason for the termination of an appointment.
//
// These reasons correspond to NIPR's valid termination codes and vary by
// state. Not all reasons are valid in every state - use ListTerminationReasons
// to get the valid reasons for a specific state before calling
// TerminateAppointment.
//
// Reference: https://pdb.nipr.com/Gateway/ValidTerms
//
// Values:
//   - TERMINATION_REASON_VOLUNTARY_TERMINATION: Producer or agency voluntarily chose to end the appointment.
//   - TERMINATION_REASON_INADEQUATE_PRODUCTION: Carrier terminated due to insufficient premium production or sales volume.
//   - TERMINATION_REASON_CANCELLED_BY_GENERAL_AGENT: Appointment was cancelled by the managing general agent (MGA).
//   - TERMINATION_REASON_DEATH: Producer has passed away.
//   - TERMINATION_REASON_COMPANY_DEFUNCT_OR_LIQUIDATION: Insurance company has ceased operations or entered liquidation.
//   - TERMINATION_REASON_COMPANY_INDEBTEDNESS: Producer owes money to the insurance company (e.g., unremitted premiums).
//   - TERMINATION_REASON_POOR_POLICYHOLDER_SERVICE: Carrier terminated due to poor service to policyholders.
//   - TERMINATION_REASON_AGENT_MOVED: Producer relocated to a different jurisdiction.
//   - TERMINATION_REASON_APPOINTED_IN_ERROR: Appointment was created in error and is being corrected.
//   - TERMINATION_REASON_CANCELLED: General cancellation without a more specific reason.
//   - TERMINATION_REASON_CANCELLED_FOR_CAUSE: Carrier terminated for cause (e.g., misconduct, policy violations).
//   - TERMINATION_REASON_COMPANY_MERGER: Insurance company merged with another company.
//   - TERMINATION_REASON_REVOKED: Producer's license has been revoked by a regulatory authority.
//   - TERMINATION_REASON_SUSPENDED_FOR_COMPLIANCE: Producer's license has been suspended for compliance issues.
//   - TERMINATION_REASON_REQUEST_REGULATORY_REVIEW: Termination is being submitted for regulatory review by the state DOI.
enum TerminationReason {
  TERMINATION_REASON_UNSPECIFIED = 0;

  // Producer or agency voluntarily chose to end the appointment.
  TERMINATION_REASON_VOLUNTARY_TERMINATION = 1;

  // Carrier terminated due to insufficient premium production or sales volume.
  TERMINATION_REASON_INADEQUATE_PRODUCTION = 2;

  // Appointment was cancelled by the managing general agent (MGA).
  TERMINATION_REASON_CANCELLED_BY_GENERAL_AGENT = 3;

  // Producer has passed away.
  TERMINATION_REASON_DEATH = 4;

  // Insurance company has ceased operations or entered liquidation.
  TERMINATION_REASON_COMPANY_DEFUNCT_OR_LIQUIDATION = 5;

  // Producer owes money to the insurance company (e.g., unremitted premiums).
  TERMINATION_REASON_COMPANY_INDEBTEDNESS = 6;

  // Carrier terminated due to poor service to policyholders.
  TERMINATION_REASON_POOR_POLICYHOLDER_SERVICE = 7;

  // Producer relocated to a different jurisdiction.
  TERMINATION_REASON_AGENT_MOVED = 8;

  // Appointment was created in error and is being corrected.
  TERMINATION_REASON_APPOINTED_IN_ERROR = 9;

  // General cancellation without a more specific reason.
  TERMINATION_REASON_CANCELLED = 10;

  // Carrier terminated for cause (e.g., misconduct, policy violations).
  TERMINATION_REASON_CANCELLED_FOR_CAUSE = 11;

  // Insurance company merged with another company.
  TERMINATION_REASON_COMPANY_MERGER = 12;

  // Producer's license has been revoked by a regulatory authority.
  TERMINATION_REASON_REVOKED = 13;

  // Producer's license has been suspended for compliance issues.
  TERMINATION_REASON_SUSPENDED_FOR_COMPLIANCE = 14;

  // Termination is being submitted for regulatory review by the state DOI.
  TERMINATION_REASON_REQUEST_REGULATORY_REVIEW = 15;
}
