syntax = "proto3";

package producerflow.event.v2;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/producerflow/mono/gen/go/producerflow/event/v2;eventv2";

// EventService reads the log of changes to the account of the tenant the API
// key belongs to: which entity changed, which of its fields, and what each one
// changed to. Current state comes from the resource APIs; the log says what to
// read again.
//
// A consumer deduplicates on the event id, applies events in the order they
// are returned, persists the checkpoint every response carries and passes it
// back, and ignores an event type or a field it does not recognise.
service EventService {
  // ListEvents returns the events after a checkpoint, in log order. Without a
  // checkpoint it returns no events and the present position: take it before
  // reading current state through the resource APIs, then read forward from
  // it.
  //
  // An update whose every change is to a field the entity's resource does not
  // carry says nothing to apply, and is not returned.
  //
  // The log can be read 90 days back. A checkpoint older than that is
  // OUT_OF_RANGE: read current state again and take a new checkpoint. A
  // checkpoint that cannot be read, or one ahead of the log, is
  // INVALID_ARGUMENT.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // GetEvent returns one event by id. NOT_FOUND means the tenant has no such
  // event in the last 90 days that ListEvents returns.
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
}

// Event records that an entity changed. Its identifiers name the entity and
// the entities it belonged to when the change happened; changes say what is
// now true of it. Each *_id is the last segment of the entity's resource name,
// for example agency_id in "agencies/{agency_id}". Which identifiers an event
// carries depends on its object, and one it does not carry is empty.
message Event {
  // A UUID, unique and stable: the key to deduplicate on.
  string id = 1;

  // "<object>.<action>", for example "license.updated". Both halves can grow:
  // ignore a type you do not handle. The object names the entity the event is
  // about, whose id is the field "<object>_id".
  string event_type = 2;

  // Where the change came from: ProducerFlowAPI, ProducerFlowPortal,
  // ProducerFlowSupport, ProducerPass, NIPR, Salesforce or BindHQ. More can be
  // added. Empty when the change recorded none.
  string origin = 3;

  // Time the change was committed. Events committed together share it, so it
  // orders the log but does not name a position in it: the checkpoint does.
  google.protobuf.Timestamp create_time = 4;

  // ID of the agency the event is about or belongs to.
  string agency_id = 5;
  // ID of the producer the event is about or belongs to.
  string producer_id = 6;
  // ID of the contact the event is about.
  string contact_id = 7;
  // ID of the organization the event is about.
  string organization_id = 8;
  // ID of the appointment the event is about.
  string appointment_id = 9;
  // ID of the license the event is about.
  string license_id = 10;
  // ID of the location the event is about.
  string location_id = 11;
  // Identifier the tenant assigned, in its own systems, to the entity the
  // event is about.
  string external_id = 12;
  // Identifier the tenant assigned to the agency.
  string external_agency_id = 13;
  // Identifier the tenant assigned to the producer.
  string external_producer_id = 14;
  // National Producer Number of the entity the event is about.
  string npn = 15;
  // USPS two-letter code of the state that issued the license.
  string license_state = 16;
  // NAIC company code of the appointment's carrier.
  string carrier_cocode = 17;
  // USPS two-letter code of the state the appointment is in.
  string appointment_state = 18;
  // ID of the agency appointment a producer's appointment was derived from.
  string parent_appointment_id = 19;
  // Organization of the event's agency, on agency, producer, contact and
  // license events. Absent when that agency belongs to none, and on the other
  // events.
  EventOrganization organization = 20;

  // Fields of the entity that changed, each with the value it now holds.
  // Empty on an event whose identifiers and event_data say all that changed.
  repeated FieldChange changes = 21;

  // Context of the transition, on the events that document it. When a
  // producer moves to another agency, the producer.updated, license.updated
  // and appointment.updated events of the move carry transfer_id and
  // source_agency_id, and their agency_id is the agency moved to; the
  // appointment.deleted events of the move carry transfer_id. When an
  // appointment's operational status moves, appointment.updated carries
  // previous_status, the status it moved off, in the form
  // operational_status.status takes.
  google.protobuf.Struct event_data = 22;
}

// EventOrganization is an organization reduced to its identifiers.
message EventOrganization {
  // ID of the organization.
  string organization_id = 1;
  // Identifier the tenant assigned to the organization. Empty when it has
  // none.
  string external_id = 2;
}

// FieldChange is one field of the entity and the value it now holds.
message FieldChange {
  // Path of the field on the entity's resource, dotted for nested messages,
  // for example "operational_status.status". On an entity whose resource the
  // API does not serve yet, the path can change when it does.
  string field = 1;

  // Value the field now holds. A null value means the field was cleared. A
  // sensitive value is a string of asterisks ending in its last four
  // characters, or only asterisks when it has four or fewer.
  google.protobuf.Value value = 2;
}

// Request message for ListEvents.
message ListEventsRequest {
  // Position to read from, as returned by an earlier response. Omit it to
  // take the present position.
  string checkpoint = 1 [(google.api.field_behavior) = OPTIONAL];

  // Maximum number of events to return. 0 means 100; the maximum is 1000.
  // Events committed together are never split across responses, so a
  // response can hold more when a single commit does.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];
}

// Response message for ListEvents.
message ListEventsResponse {
  // Events after the requested checkpoint, in log order. Among events
  // committed together, an entity's events come before those of the entities
  // that belong to it, except deletions, which come last and in the reverse
  // order.
  repeated Event events = 1;

  // Position this read reached, set on every response. Persist it and pass it
  // back.
  string checkpoint = 2;

  // Whether more events follow the returned checkpoint. A response can hold
  // no events while it is true: keep reading until it is false. False means
  // caught up, not that nothing further will arrive.
  bool has_more = 3;
}

// Request message for GetEvent.
message GetEventRequest {
  // ID of the event.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true
  ];
}

// Response message for GetEvent.
message GetEventResponse {
  // The event.
  Event event = 1;
}
