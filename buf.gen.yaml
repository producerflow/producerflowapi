version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/producerflow/producerflowapi/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-es
    out: gen/ts
    opt:
      - target=ts
      - import_extension=none
    include_imports: true
    strategy: all
  # Kotlin/Java plugins
  # Java protobuf messages
  - remote: buf.build/protocolbuffers/java:v28.3
    out: gen/kotlin/src/main/java
    include_imports: true
  # Kotlin protobuf DSL builders
  - remote: buf.build/protocolbuffers/kotlin:v28.3
    out: gen/kotlin/src/main/kotlin
    include_imports: true
  # Java gRPC stubs (BlockingStub, FutureStub, Stub)
  - remote: buf.build/grpc/java:v1.68.1
    out: gen/kotlin/src/main/java
    include_imports: true
  # Kotlin gRPC stubs (coroutine-based)
  - remote: buf.build/grpc/kotlin:v1.5.0
    out: gen/kotlin/src/main/kotlin
    include_imports: true
  # Connect-RPC Kotlin (alternative to gRPC, kept for compatibility)
  - remote: buf.build/connectrpc/kotlin:v0.7.4
    out: gen/kotlin/src/main/kotlin
    opt:
      - generateCoroutineMethods=true
      - generateBlockingUnaryMethods=true
  # Documentation plugins
  - local: ["go", "run", "github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1"]
    out: wiki
    opt: templates/html-api.tmpl,API-Reference.html
    strategy: all
  - local: ["go", "run", "github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1"]
    out: wiki
    opt: templates/markdown-api.tmpl,API-Reference.md
    strategy: all
